<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe6">
    <title>Utility Desk | Node Modules</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Utility Desk home">
          <span class="brand-mark" aria-hidden="true">U</span>
          <span>UTILITY DESK</span>
        </a>
        <span class="server-status"><span class="status-dot"></span>LOCAL SERVER</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">NODE MODULES <span>/</span> 01—03</p>
          <h1 id="page-title">Small tools.<br><em>Ready to work.</em></h1>
          <p class="intro-note">A little utility for whatever's next.</p>
        </section>

        <section class="tool-grid" aria-label="Node utilities">
          <article class="tool-panel random-panel">
            <div class="panel-heading">
              <span class="tool-number">01</span>
              <h2>Random integer</h2>
              <span class="panel-glyph" aria-hidden="true">↗</span>
            </div>
            <form id="random-form" class="tool-form">
              <div class="field-pair">
                <label>Minimum<input id="minimum" name="min" type="number" value="1" step="1" required></label>
                <label>Maximum<input id="maximum" name="max" type="number" value="100" step="1" required></label>
              </div>
              <div class="result-row">
                <output id="random-result" class="number-result" aria-live="polite">—</output>
                <button class="action-button" type="submit">Generate <span aria-hidden="true">↗</span></button>
              </div>
              <p id="random-error" class="error-message" aria-live="polite"></p>
            </form>
          </article>

          <article class="tool-panel dash-panel">
            <div class="panel-heading">
              <span class="tool-number">02</span>
              <h2>Space to dash</h2>
              <span class="panel-glyph" aria-hidden="true">↗</span>
            </div>
            <label class="wide-field">Your text<textarea id="dash-input" rows="2" placeholder="A phrase with spaces"></textarea></label>
            <div class="result-row text-result-row">
              <output id="dash-result" class="text-result" aria-live="polite">Your-dashed-text</output>
              <button id="copy-result" class="copy-button" type="button" aria-label="Copy converted text" title="Copy result">COPY</button>
            </div>
            <p id="dash-error" class="error-message" aria-live="polite"></p>
          </article>

          <article class="tool-panel count-panel">
            <div class="panel-heading">
              <span class="tool-number">03</span>
              <h2>Word count</h2>
              <span class="panel-glyph" aria-hidden="true">↗</span>
            </div>
            <label class="wide-field">Your text<textarea id="count-input" rows="3" placeholder="Paste or write something..."></textarea></label>
            <div class="count-result" aria-live="polite">
              <output id="count-result">0</output>
              <span id="word-label">WORDS</span>
            </div>
            <p id="count-error" class="error-message" aria-live="polite"></p>
          </article>
        </section>
      </main>

      <footer class="footer">
        <span>THREE MODULES, ONE DESK</span>
        <span>BUILT WITH NODE.JS</span>
      </footer>
    </div>
  </body>
</html>
